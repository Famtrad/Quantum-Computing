<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Workslop — X Mentions Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --positive: #3fb950;
    --neutral: #8b949e;
    --negative: #f85149;
    --engagement: #d2a8ff;
    --likes: #ff7b72;
    --reposts: #79c0ff;
    --replies: #56d364;
  }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }
  header { padding: 24px 32px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  header h1 { font-size: 1.25rem; font-weight: 600; color: var(--text); }
  header h1 span { color: var(--accent); }
  .subtitle { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
  .date-range-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .date-range-bar label { font-size: 0.78rem; color: var(--muted); }
  .date-range-bar input[type=date] {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); padding: 5px 10px; font-size: 0.8rem; outline: none; cursor: pointer;
  }
  .date-range-bar input[type=date]:focus { border-color: var(--accent); }
  .btn-reset {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); padding: 5px 12px; font-size: 0.78rem; cursor: pointer; transition: all .15s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }
  .quick-btns { display: flex; gap: 6px; }
  .qbtn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--muted); padding: 4px 10px; font-size: 0.75rem; cursor: pointer; transition: all .15s;
  }
  .qbtn:hover, .qbtn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { padding: 24px 32px; display: flex; flex-direction: column; gap: 24px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px 20px; cursor: default; transition: border-color .15s;
  }
  .kpi-card:hover { border-color: var(--accent); }
  .kpi-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }
  .kpi-value { font-size: 1.9rem; font-weight: 700; line-height: 1; }
  .kpi-value.mentions { color: var(--accent); }
  .kpi-value.engagement { color: var(--engagement); }
  .kpi-value.likes { color: var(--likes); }
  .kpi-value.reposts { color: var(--reposts); }
  .kpi-sub { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }
  .chart-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px 24px;
  }
  .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 10px; }
  .chart-title { font-size: 0.9rem; font-weight: 600; color: var(--text); }
  .chart-controls { display: flex; gap: 6px; flex-wrap: wrap; }
  .toggle-btn {
    border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px;
    font-size: 0.72rem; cursor: pointer; transition: all .15s; background: transparent;
    display: flex; align-items: center; gap: 5px;
  }
  .toggle-btn .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .toggle-btn.active { background: var(--surface2); }
  .toggle-btn:hover { border-color: var(--accent); }
  .bottom-row { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  canvas { max-height: 320px; }
  #sentimentCanvas { max-height: 260px; }
  #countryCanvas { max-height: 280px; }
  #languageCanvas { max-height: 280px; }
  .tooltip-custom { pointer-events: none; }
  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .bottom-row { grid-template-columns: 1fr; }
    main { padding: 16px; }
    header { padding: 16px; }
  }
  @media (max-width: 500px) {
    .kpi-row { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1><span>AI Workslop</span> &mdash; X Mentions Dashboard</h1>
    <div class="subtitle">Meltwater export &bull; Jan 14 2025 &ndash; Jan 14 2026 &bull; 54,476 mentions</div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px;align-items:flex-end;">
    <div class="date-range-bar">
      <label>From</label>
      <input type="date" id="dateFrom" value="2025-01-14" min="2025-01-14" max="2026-01-14">
      <label>To</label>
      <input type="date" id="dateTo" value="2026-01-14" min="2025-01-14" max="2026-01-14">
      <button class="btn-reset" id="resetBtn">Reset</button>
    </div>
    <div class="quick-btns">
      <button class="qbtn" data-days="30">30d</button>
      <button class="qbtn" data-days="90">90d</button>
      <button class="qbtn" data-days="180">180d</button>
      <button class="qbtn active" data-days="365">1yr</button>
    </div>
  </div>
</header>

<main>
  <div class="kpi-row">
    <div class="kpi-card"><div class="kpi-label">Total Mentions</div><div class="kpi-value mentions" id="kpiMentions">0</div><div class="kpi-sub" id="kpiMentionsSub"></div></div>
    <div class="kpi-card"><div class="kpi-label">Total Engagement</div><div class="kpi-value engagement" id="kpiEngagement">0</div><div class="kpi-sub" id="kpiEngagementSub"></div></div>
    <div class="kpi-card"><div class="kpi-label">Total Likes</div><div class="kpi-value likes" id="kpiLikes">0</div><div class="kpi-sub" id="kpiLikesSub"></div></div>
    <div class="kpi-card"><div class="kpi-label">Total Reposts</div><div class="kpi-value reposts" id="kpiReposts">0</div><div class="kpi-sub" id="kpiRepostsSub"></div></div>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">Daily Mention Volume</div>
      <div class="chart-controls" id="timeseriesControls">
        <button class="toggle-btn active" data-metric="mentions" style="color:#58a6ff;border-color:#58a6ff;">
          <span class="dot" style="background:#58a6ff"></span>Mentions
        </button>
        <button class="toggle-btn" data-metric="engagement" style="color:#d2a8ff;border-color:#30363d;">
          <span class="dot" style="background:#d2a8ff"></span>Engagement
        </button>
        <button class="toggle-btn" data-metric="likes" style="color:#ff7b72;border-color:#30363d;">
          <span class="dot" style="background:#ff7b72"></span>Likes
        </button>
        <button class="toggle-btn" data-metric="reposts" style="color:#79c0ff;border-color:#30363d;">
          <span class="dot" style="background:#79c0ff"></span>Reposts
        </button>
      </div>
    </div>
    <canvas id="timeseriesCanvas"></canvas>
  </div>

  <div class="chart-card">
    <div class="chart-header">
      <div class="chart-title">Sentiment Over Time</div>
      <div class="chart-controls" id="sentimentControls">
        <button class="toggle-btn active" data-sent="positive" style="color:#3fb950;border-color:#3fb950;"><span class="dot" style="background:#3fb950"></span>Positive</button>
        <button class="toggle-btn active" data-sent="neutral" style="color:#8b949e;border-color:#8b949e;"><span class="dot" style="background:#8b949e"></span>Neutral</button>
        <button class="toggle-btn active" data-sent="negative" style="color:#f85149;border-color:#f85149;"><span class="dot" style="background:#f85149"></span>Negative</button>
      </div>
    </div>
    <canvas id="sentimentCanvas"></canvas>
  </div>

  <div class="bottom-row">
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">Top Countries</div></div>
      <canvas id="countryCanvas"></canvas>
    </div>
    <div class="chart-card">
      <div class="chart-header"><div class="chart-title">Language Distribution</div></div>
      <canvas id="languageCanvas"></canvas>
    </div>
  </div>
</main>

// --- helpers ---
function fmt(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toLocaleString();
}

function filterByRange(from, to) {
  const result = { dates:[], mentions:[], positive:[], neutral:[], negative:[], engagement:[], likes:[], reposts:[], replies:[] };
  RAW.dates.forEach((d, i) => {
    if (d >= from && d <= to) {
      result.dates.push(d);
      ['mentions','positive','neutral','negative','engagement','likes','reposts','replies'].forEach(k => result[k].push(RAW[k][i]));
    }
  });
  return result;
}

const COLORS = { mentions:'#58a6ff', engagement:'#d2a8ff', likes:'#ff7b72', reposts:'#79c0ff', replies:'#56d364', positive:'#3fb950', neutral:'#8b949e', negative:'#f85149' };

const chartDefaults = {
  responsive: true,
  maintainAspectRatio: true,
  plugins: { legend: { display: false }, tooltip: { backgroundColor:'#161b22', borderColor:'#30363d', borderWidth:1, titleColor:'#e6edf3', bodyColor:'#8b949e', padding:10, callbacks:{} } },
  scales: {
    x: { grid: { color:'#21262d' }, ticks: { color:'#8b949e', font:{size:11} } },
    y: { grid: { color:'#21262d' }, ticks: { color:'#8b949e', font:{size:11}, callback: v => fmt(v) } }
  }
};

// --- Time series chart ---
let activeMetrics = new Set(['mentions']);
let tsChart;

function buildTSDatasets(filtered) {
  return [...activeMetrics].map(m => ({
    label: m.charAt(0).toUpperCase()+m.slice(1),
    data: filtered.dates.map((d,i) => ({ x: d, y: filtered[m][i] })),
    borderColor: COLORS[m],
    backgroundColor: COLORS[m] + '22',
    borderWidth: 2,
    pointRadius: filtered.dates.length > 90 ? 0 : 3,
    pointHoverRadius: 5,
    fill: activeMetrics.size === 1,
    tension: 0.3,
  }));
}

function initTS(filtered) {
  const ctx = document.getElementById('timeseriesCanvas').getContext('2d');
  tsChart = new Chart(ctx, {
    type: 'line',
    data: { datasets: buildTSDatasets(filtered) },
    options: {
      ...chartDefaults,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type:'time', time:{ unit: filtered.dates.length > 180 ? 'month' : 'week', tooltipFormat:'MMM d, yyyy' }, grid:{color:'#21262d'}, ticks:{color:'#8b949e',font:{size:11}} },
        y: { ...chartDefaults.scales.y }
      },
      plugins: {
        ...chartDefaults.plugins,
        tooltip: {
          ...chartDefaults.plugins.tooltip,
          callbacks: {
            title: items => items[0].label,
            label: item => ` ${item.dataset.label}: ${fmt(item.raw.y)}`
          }
        }
      }
    }
  });
}

      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type:'time', time:{ unit: filtered.dates.length > 180 ? 'month' : 'week', tooltipFormat:'MMM d, yyyy' }, stacked:true, grid:{color:'#21262d'}, ticks:{color:'#8b949e',font:{size:11}} },
        y: { stacked:true, ...chartDefaults.scales.y }
      },
      plugins: {
        ...chartDefaults.plugins,
        tooltip: {
          ...chartDefaults.plugins.tooltip,
          callbacks: {
            title: items => items[0].label,
            label: item => ` ${item.dataset.label}: ${fmt(item.raw.y)}`
          }
        }
      }
    }
  });
}

// --- Country bar chart ---
let countryChart;
function initCountry(countries) {
  const labels = Object.keys(countries);
  const values = Object.values(countries);
  const ctx = document.getElementById('countryCanvas').getContext('2d');
  countryChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{ data: values, backgroundColor: '#58a6ff99', borderColor:'#58a6ff', borderWidth:1, borderRadius:4 }]
    },
    options: {
      ...chartDefaults,
      indexAxis: 'y',
      scales: {
        x: { ...chartDefaults.scales.x, ticks: { ...chartDefaults.scales.x.ticks, callback: v => fmt(v) } },
        y: { ...chartDefaults.scales.y, ticks: { color:'#8b949e', font:{size:11} } }
      },
      plugins: {
        ...chartDefaults.plugins,
        tooltip: {
          ...chartDefaults.plugins.tooltip,
          callbacks: { label: item => ` ${fmt(item.raw)} mentions` }
        }
      },
      onClick: (e, elements) => {
        if (elements.length) {
          const country = labels[elements[0].index];
          highlightCountry(country);
        }
      }
    }
  });
}

// --- Language donut ---
let languageChart;
const LANG_COLORS = ['#58a6ff','#3fb950','#d2a8ff','#ff7b72','#79c0ff','#56d364','#ffa657','#e3b341','#f0883e','#bc8cff'];
function initLanguage(languages) {
  const labels = Object.keys(languages);
  const values = Object.values(languages);
  const ctx = document.getElementById('languageCanvas').getContext('2d');
  languageChart = new Chart(ctx, {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: LANG_COLORS, borderColor:'#161b22', borderWidth:2 }] },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: {
        legend: { display: true, position:'right', labels:{ color:'#8b949e', font:{size:11}, boxWidth:12, padding:10 } },
        tooltip: {
          backgroundColor:'#161b22', borderColor:'#30363d', borderWidth:1,
          titleColor:'#e6edf3', bodyColor:'#8b949e', padding:10,
          callbacks: {
            label: item => {
              const total = item.dataset.data.reduce((a,b)=>a+b,0);
              const pct = ((item.raw/total)*100).toFixed(1);
              return ` ${fmt(item.raw)} (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

// --- Country filter highlight ---
let countryFilter = null;
function highlightCountry(country) {
  if (countryFilter === country) {
    countryFilter = null;
    countryChart.data.datasets[0].backgroundColor = Array(Object.keys(RAW.countries).length).fill('#58a6ff99');
    countryChart.data.datasets[0].borderColor = Array(Object.keys(RAW.countries).length).fill('#58a6ff');
  } else {
    countryFilter = country;
    const labels = Object.keys(RAW.countries);
    countryChart.data.datasets[0].backgroundColor = labels.map(l => l===country ? '#58a6ff' : '#58a6ff22');
    countryChart.data.datasets[0].borderColor = labels.map(l => l===country ? '#58a6ff' : '#30363d');
  }
  countryChart.update();
}

// --- KPI update ---
function updateKPIs(filtered) {
  const sum = arr => arr.reduce((a,b)=>a+b,0);
  const m = sum(filtered.mentions), e = sum(filtered.engagement), l = sum(filtered.likes), r = sum(filtered.reposts);
  document.getElementById('kpiMentions').textContent = fmt(m);
  document.getElementById('kpiEngagement').textContent = fmt(e);
  document.getElementById('kpiLikes').textContent = fmt(l);
  document.getElementById('kpiReposts').textContent = fmt(r);
  const days = filtered.dates.length;
  document.getElementById('kpiMentionsSub').textContent = `avg ${fmt(Math.round(m/Math.max(days,1)))} / day`;
  document.getElementById('kpiEngagementSub').textContent = `avg ${fmt(Math.round(e/Math.max(days,1)))} / day`;
  document.getElementById('kpiLikesSub').textContent = `avg ${fmt(Math.round(l/Math.max(days,1)))} / day`;
  document.getElementById('kpiRepostsSub').textContent = `avg ${fmt(Math.round(r/Math.max(days,1)))} / day`;
}

// --- Full refresh ---
function refresh() {
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  const filtered = filterByRange(from, to);
  updateKPIs(filtered);
  if (tsChart) { tsChart.data.datasets = buildTSDatasets(filtered); tsChart.update(); }
  if (sentimentChart) { sentimentChart.data.datasets = buildSentDatasets(filtered); sentimentChart.update(); }
}

// --- Init ---
const initFiltered = filterByRange('2025-01-14', '2026-01-14');
updateKPIs(initFiltered);
initTS(initFiltered);
initSentiment(initFiltered);
initCountry(RAW.countries);
initLanguage(RAW.languages);

// --- Date range controls ---
document.getElementById('dateFrom').addEventListener('change', () => { clearQuick(); refresh(); });
document.getElementById('dateTo').addEventListener('change', () => { clearQuick(); refresh(); });
document.getElementById('resetBtn').addEventListener('click', () => {
  document.getElementById('dateFrom').value = '2025-01-14';
  document.getElementById('dateTo').value = '2026-01-14';
  document.querySelectorAll('.qbtn').forEach(b => b.classList.toggle('active', b.dataset.days==='365'));
  refresh();
});

function clearQuick() { document.querySelectorAll('.qbtn').forEach(b => b.classList.remove('active')); }

document.querySelectorAll('.qbtn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.qbtn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const days = parseInt(btn.dataset.days);
    const to = new Date('2026-01-14');
    const from = new Date(to);
    from.setDate(from.getDate() - days + 1);
    document.getElementById('dateTo').value = to.toISOString().slice(0,10);
    document.getElementById('dateFrom').value = from.toISOString().slice(0,10);
    refresh();
  });
});

// --- Timeseries metric toggles ---
document.querySelectorAll('#timeseriesControls .toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const metric = btn.dataset.metric;
    if (activeMetrics.has(metric)) {
      if (activeMetrics.size === 1) return;
      activeMetrics.delete(metric);
      btn.classList.remove('active');
      btn.style.borderColor = '#30363d';
    } else {
      activeMetrics.add(metric);
      btn.classList.add('active');
      btn.style.borderColor = COLORS[metric];
    }
    refresh();
  });
});

// --- Sentiment toggles ---
document.querySelectorAll('#sentimentControls .toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const sent = btn.dataset.sent;
    if (activeSentiments.has(sent)) {
      if (activeSentiments.size === 1) return;
      activeSentiments.delete(sent);
      btn.classList.remove('active');
      btn.style.borderColor = '#30363d';
    } else {
      activeSentiments.add(sent);
      btn.classList.add('active');
      btn.style.borderColor = COLORS[sent];
    }
    refresh();
  });
});
</script>
